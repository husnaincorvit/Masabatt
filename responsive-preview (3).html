<style>:root {
  /* Figma screenshot se liye gaye asli rang */
  --bg: #fef4e3;
  --bg-2: #f4ecdc;
  --brown: #84503d;
  --brown-d: #77604c;
  --ink: #4a3426;
  --muted: #7a6554;
  --line: #b98a7c;
  --gold: #c8a24e;
  --gold-2: #e3c277;
  --green: #14261e;
  --green-2: #17392b;
  --green-3: #1d4636;
  --cream: #f6eddb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 2.1;
  direction: rtl;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
img { max-width: 100%; display: block; }
input, textarea, button { font-family: inherit; }

.container { width: min(1100px, 100% - 40px); margin-inline: auto; }
.sec { padding: clamp(36px, 6vw, 72px) 0; position: relative; }
/* tasveer ka slot: asli file ho to next/image, warna neutral slot */

.media.is-empty { background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNmY2MjUyIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cmVjdCB4PSI4IiB5PSIxMiIgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQwIiByeD0iNCIvPjxjaXJjbGUgY3g9IjIyIiBjeT0iMjYiIHI9IjQiLz48cGF0aCBkPSJNOCA0NGwxNC0xMiAxMCA4IDgtNiAxNiAxNCIvPjwvc3ZnPgo="); background-repeat: no-repeat; background-position: center; background-size: clamp(28px, 22%, 56px); }
.media-dark { background-color: #1b3a2d; }

/* =========================================================
   FIGMA PAGE
   ========================================================= */

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid #e9d9bb; }
.topbar-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; }
.logo {
  flex: none; width: 64px; height: 34px; border: 1px solid var(--gold); border-radius: 50%;
  display: grid; place-items: center; color: var(--brown); font-size: 13px; line-height: 1;
  outline: 1px solid #c8a24e66; outline-offset: 3px;
}
.topbar nav ul { display: flex; gap: clamp(12px, 2vw, 26px); font-size: 13px; color: var(--brown-d); }
.topbar nav a:hover { color: var(--brown); }
.burger { display: none; background: none; border: 0; color: var(--brown); font-size: 26px; cursor: pointer; line-height: 1; }
@media (max-width: 820px) {
  .burger { display: block; }
  .topbar-in { position: relative; }
  .topbar nav { position: absolute; top: 100%; inset-inline: -20px; background: var(--bg); border-bottom: 1px solid #e9d9bb; }
  .topbar nav ul { display: none; flex-direction: column; gap: 0; padding: 6px 20px 14px; font-size: 15px; }
  .topbar nav ul.open { display: flex; }
  .topbar nav li { border-bottom: 1px solid #e9d9bb; }
  .topbar nav a { display: block; padding: 4px 0; }
}

/* ---------- hero ---------- */
.hero-fig { position: relative; width: 100%; aspect-ratio: 16 / 8.6; min-height: 220px; max-height: 760px; background: #0a1222; overflow: hidden; }
.hero-fig .media { position: absolute; inset: 0; }
.hero-fig .media.is-empty {
  background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjYTg4ZjZhIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cmVjdCB4PSI4IiB5PSIxMiIgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQwIiByeD0iNCIvPjxjaXJjbGUgY3g9IjIyIiBjeT0iMjYiIHI9IjQiLz48cGF0aCBkPSJNOCA0NGwxNC0xMiAxMCA4IDgtNiAxNiAxNCIvPjwvc3ZnPgo="), linear-gradient(180deg, #0a1222 0%, #1b2a3f 60%, #4a3517 100%);
  background-position: center, center; background-size: 64px, cover;
}
.hero-fig::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, #0006, transparent 25%, transparent 70%, #0004); }

/* ---------- small titles ---------- */
.mini-title { font-size: clamp(15px, 2vw, 18px); font-weight: 600; color: var(--brown); position: relative; }
.mini-title.center { text-align: center; margin-bottom: clamp(18px, 3vw, 30px); }
.fig-title {
  display: flex; align-items: center; justify-content: center; gap: 12px; text-align: center;
  font-size: clamp(16px, 2.2vw, 20px); font-weight: 600; color: var(--brown);
  margin-bottom: clamp(22px, 4vw, 40px);
}
.fig-title::before, .fig-title::after {
  content: ""; width: clamp(28px, 6vw, 56px); height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* ---------- buttons ---------- */
.btn-pill {
  display: inline-block; background: var(--brown-d); color: #fff; border: 0; cursor: pointer;
  padding: 0 26px; border-radius: 999px; font-size: 13px; line-height: 2.1; transition: .2s;
}
.btn-pill:hover { background: var(--brown); }
.btn-block {
  width: 100%; background: var(--brown); color: #fff; border: 0; border-radius: 6px; cursor: pointer;
  padding: 6px 12px; font-size: 14px; transition: .2s;
}
.btn-block:hover { background: #6f3b2b; }

/* ---------- intro ---------- */
.intro-fig { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: clamp(20px, 6vw, 80px); max-width: 880px; }
.intro-text .mini-title { margin-bottom: 4px; }
.intro-text p { font-size: 13px; color: var(--muted); line-height: 2.2; margin-bottom: 14px; }
.dome-art { aspect-ratio: 420 / 360; width: min(380px, 100%); margin-inline: auto; }
.dome-art.is-empty { border-radius: 18px; }
.dome-art.has-img { background: transparent; overflow: visible; }
@media (max-width: 700px) {
  .intro-fig { grid-template-columns: 1fr; text-align: center; }
  .dome-art { order: -1; width: min(300px, 80%); }
}

/* ---------- divider ---------- */
.divider {
  width: min(430px, 70%); height: 1px; margin: 0 auto; position: relative;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
}
.divider::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; background: var(--brown);
  transform: translate(-50%, -50%) rotate(45deg);
}

/* ---------- two-column list with centre line ---------- */
.lattice::before, .lattice::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: clamp(34px, 8vw, 110px); pointer-events: none;
  background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI3MCIgaGVpZ2h0PSI3MCIgdmlld0JveD0iMCAwIDcwIDcwIj4KICA8ZyBmaWxsPSJub25lIiBzdHJva2U9IiNkOWIwYTYiIHN0cm9rZS13aWR0aD0iMS40IiBvcGFjaXR5PSIuNzUiPgogICAgPHBhdGggZD0iTTM1IDQgTDY2IDM1IEwzNSA2NiBMNCAzNSBaIi8+CiAgICA8cGF0aCBkPSJNMzUgMTggTDUyIDM1IEwzNSA1MiBMMTggMzUgWiIgc3Ryb2tlPSIjYjljMzljIi8+CiAgPC9nPgogIDxjaXJjbGUgY3g9IjM1IiBjeT0iMzUiIHI9IjMiIGZpbGw9IiNlOWE5YTAiIG9wYWNpdHk9Ii44Ii8+CiAgPGNpcmNsZSBjeD0iMCIgY3k9IjAiIHI9IjMiIGZpbGw9IiNlOWE5YTAiIG9wYWNpdHk9Ii42Ii8+PGNpcmNsZSBjeD0iNzAiIGN5PSIwIiByPSIzIiBmaWxsPSIjZTlhOWEwIiBvcGFjaXR5PSIuNiIvPgogIDxjaXJjbGUgY3g9IjAiIGN5PSI3MCIgcj0iMyIgZmlsbD0iI2U5YTlhMCIgb3BhY2l0eT0iLjYiLz48Y2lyY2xlIGN4PSI3MCIgY3k9IjcwIiByPSIzIiBmaWxsPSIjZTlhOWEwIiBvcGFjaXR5PSIuNiIvPgo8L3N2Zz4K") repeat-y center top / 70px;
  -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent);
          mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent);
}
.lattice .container { width: min(1100px, 100% - 2 * clamp(34px, 8vw, 110px)); }
.lattice::before { right: 0; }
.lattice::after { left: 0; }

.split-list { position: relative; width: min(520px, 100%); margin-inline: auto; }
.split-list::before {
  content: ""; position: absolute; inset-block: 6px; left: 50%; width: 2px; transform: translateX(-50%); background: var(--brown);
}
.split-list li { position: relative; display: grid; grid-template-columns: 1fr 1fr; }
.split-list li::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; background: var(--brown); border-radius: 50%;
  transform: translate(-50%, -50%);
}
.cell { display: block; font-size: 13px; line-height: 2.5; color: var(--brown-d); padding-block: 2px; }
.cell:hover { color: var(--brown); }
.cell-r { padding-left: 26px; }   /* dahni column: line se faasla bayen taraf */
.cell-l { padding-right: 26px; }  /* bayen column: line se faasla dahni taraf */
@media (max-width: 420px) { .cell { font-size: 12px; } .cell-r { padding-left: 18px; } .cell-l { padding-right: 18px; } }

/* ---------- people ---------- */
.people-fig { display: flex; justify-content: center; gap: clamp(24px, 9vw, 130px); }
.person-fig { text-align: center; width: min(240px, 44%); }
.cusp-wrap { width: 100%; aspect-ratio: 1; margin-bottom: 8px; filter: drop-shadow(0 6px 14px #5f423244); }
.cusp { width: 100%; height: 100%; clip-path: url(#shape-cusp); }
.person-fig h3 { font-size: clamp(13px, 1.8vw, 16px); font-weight: 600; color: var(--brown); }
.person-fig small { display: block; font-size: 12px; color: var(--muted); line-height: 1.9; }
.person-fig p { font-size: 11px; color: var(--muted); line-height: 1.9; }

/* ---------- gallery ---------- */
.gal-fig {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.1fr) minmax(0, 1fr);
  gap: clamp(10px, 3vw, 40px); width: min(680px, 100%); margin-inline: auto; align-items: center;
}
.gal-col { display: grid; gap: clamp(8px, 2vw, 22px); }
.star { aspect-ratio: 1; width: 100%; clip-path: url(#shape-star); }
.mihrab { aspect-ratio: 0.86; width: 100%; clip-path: url(#shape-mihrab); }

/* ---------- books ---------- */
.books-fig { display: flex; justify-content: center; gap: clamp(14px, 6vw, 90px); }
.book-fig { text-align: center; width: min(170px, 28%); }
.book3d {
  position: relative; aspect-ratio: 3 / 4.1; width: 100%; margin-bottom: 14px; border-radius: 3px 8px 8px 3px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 14% 8% 8%;
  transform: perspective(700px) rotateY(-18deg) rotateZ(-2deg); transform-origin: 60% 60%;
  box-shadow: -10px 14px 22px #3a1d1244, inset 3px 0 0 #ffffff55; overflow: hidden;
}
.book3d.dark { background: linear-gradient(135deg, #202020, #050505); color: var(--gold-2); transform: perspective(700px) rotateY(18deg) rotateZ(2deg); }
.book3d.light { background: linear-gradient(135deg, #fff, #e8e8e8); color: #1b1b1b; }
.book3d.split { background: linear-gradient(#1c1c1c 0 52%, #f2f2f2 52% 100%); color: var(--gold-2); }
.book-title { font-size: clamp(14px, 3vw, 28px); line-height: 1.5; font-weight: 700; }
.book-badge { margin-top: auto; font-size: clamp(7px, 1vw, 10px); line-height: 1.6; opacity: .75; color: inherit; }
.book3d.split .book-badge { color: #555; }
.book-fig h3 { font-size: clamp(12px, 1.8vw, 15px); font-weight: 600; color: var(--brown); line-height: 1.9; }
.book-fig small { font-size: 11px; color: var(--muted); }

/* ---------- contact ---------- */
.contact-fig { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.6fr); gap: 16px; width: min(720px, 100%); margin-inline: auto; align-items: start; }
.card-sm, .card-lg { background: #fff; border-radius: 6px; padding: 12px; box-shadow: 0 2px 14px #8a4b3814; }
.card-sm { display: grid; gap: 10px; background: transparent; box-shadow: none; padding: 0; }
.icon-field {
  display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 4px; padding: 4px 12px; color: var(--brown);
  box-shadow: 0 2px 10px #8a4b3814;
}
.icon-field input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 13px; color: var(--ink); }
.icon-field:focus-within { outline: 2px solid var(--gold); }
.card-lg { display: grid; gap: 10px; padding: 16px; }
.card-lg label { display: grid; font-size: 11px; color: var(--muted); line-height: 1.9; }
.card-lg input, .card-lg textarea {
  border: 0; background: #f3f0e9; border-radius: 3px; padding: 4px 10px; font-size: 13px; width: 100%; outline: 0; color: var(--ink);
}
.card-lg textarea { resize: vertical; min-height: 110px; }
.card-lg input:focus, .card-lg textarea:focus { outline: 2px solid var(--gold); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card-lg .btn-pill { justify-self: end; background: var(--brown); padding-inline: 22px; }
.ok { font-size: 12px; color: var(--brown); }
@media (max-width: 640px) { .contact-fig { grid-template-columns: 1fr; } }

/* ---------- footer ---------- */
.footer-fig { padding: 40px 0 16px; background: var(--bg); }
.foot-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid #e9d9bb; }
.foot-search { flex: 0 1 300px; }
.foot-search input { width: 100%; border: 0; outline: 0; background: #efe6d2; border-radius: 4px; padding: 3px 14px; font-size: 13px; color: var(--ink); }
.foot-search input:focus { outline: 2px solid var(--gold); }
.foot-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 20px 0; width: min(760px, 100%); margin-inline: auto; }
.foot-cols h4 { font-size: 13px; color: var(--brown); font-weight: 600; margin-bottom: 2px; }
.foot-cols li { font-size: 12px; color: var(--muted); line-height: 2.2; }
.foot-cols a:hover { color: var(--brown); }
.foot-bottom { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: var(--muted); border-top: 1px solid #e9d9bb; padding-top: 10px; }
@media (max-width: 520px) { .foot-cols { grid-template-columns: 1fr 1fr; } .foot-top { flex-direction: column; align-items: stretch; } .foot-top .logo { align-self: flex-start; } }

/* =========================================================
   ADDED SECTIONS: banner, افکار و خیالات, اقوالِ زریں, مضامین, تقریبات
   ========================================================= */

.sec-title { text-align: center; margin-bottom: clamp(26px, 4vw, 44px); }
.sec-title::before { content: ""; display: block; width: 8px; height: 8px; margin: 0 auto 6px; border-radius: 50%; background: var(--gold); }
.sec-title h2 { font-size: clamp(22px, 3vw, 30px); font-weight: 600; line-height: 1.9; }
.sec-title::after { content: ""; display: block; width: 72px; height: 2px; margin: 2px auto 0; background: var(--gold); opacity: .75; }
.light .sec-title h2 { color: #1f1a14; }
.dark .sec-title h2 { color: #f3ead6; }

/* buttons / links for these sections */
.btn-gold {
  display: inline-flex; align-items: center; gap: 8px; background: var(--gold); color: #1a2a20;
  padding: 2px 22px; border-radius: 999px; font-size: 13px; line-height: 2.2;
}
.btn-gold:hover { background: var(--gold-2); transform: translateY(-1px); }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid #c8a24e88; color: var(--gold-2);
  padding: 0 20px; border-radius: 999px; font-size: 12px; line-height: 2.3;
}
.btn-ghost:hover { background: var(--gold); color: #1a2a20; }
.more-link-dark {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--brown);
  border-bottom: 1px solid var(--gold); padding-bottom: 1px; line-height: 2; transition: gap .2s, color .2s;
}
.more-link-dark:hover { gap: 10px; color: #5f3322; }

/* ---------- year banner ---------- */
.year-sec { padding: clamp(36px, 6vw, 64px) 0; }
.badge {
  position: absolute; top: 14px; left: clamp(12px, 2vw, 22px); background: var(--gold); color: #1a2a20;
  font-size: 10px; line-height: 1.9; padding: 0 12px; border-radius: 999px;
}
.year { display: grid; grid-template-columns: minmax(200px, .6fr) minmax(0, 1.5fr); align-items: center; gap: clamp(20px, 4vw, 48px); }
.year-num {
  align-self: stretch; display: grid; place-content: center; text-align: center; color: var(--gold);
  font-size: clamp(56px, 9vw, 104px); line-height: 1.4; padding-inline-end: clamp(16px, 4vw, 48px);
  border-inline-end: 1px solid #c8a24e40;
}
.year-num span { position: relative; display: inline-block; padding-top: 10px; }
.year-num span::before { content: ""; position: absolute; top: 0; left: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
.year-num span::after { content: ""; display: block; width: 80px; height: 3px; background: #8a7a3d; margin: 6px auto 0; }
.year-text h2 { font-size: clamp(22px, 3vw, 30px); font-weight: 600; color: #f5ecd8; }
.year-text p { font-size: 13px; color: #cfc6b0; margin: 6px 0 18px; max-width: 46ch; }
@media (max-width: 760px) {
  .year { grid-template-columns: 1fr; text-align: center; }
  .year-num { border-inline-end: 0; border-bottom: 1px solid #c8a24e40; padding: 8px 0 18px; }
  .year-text p { margin-inline: auto; }
  .badge { position: static; display: block; width: max-content; margin: 0 auto 14px; }
}

/* ---------- thoughts ---------- */
.thoughts { display: grid; grid-template-columns: 1fr 1fr; width: min(980px, 100%); margin-inline: auto; }
.thought { display: flex; flex-direction: column; padding: 4px clamp(18px, 4vw, 48px); }
.thought:first-child { border-inline-end: 1px solid #b9976a55; }
.thought .tag { font-size: 11px; color: var(--brown); }
.thought h3 { font-size: clamp(18px, 2.2vw, 22px); font-weight: 700; color: #1f1a14; margin-bottom: 6px; }
.thought p { font-size: 13px; color: var(--muted); line-height: 2.3; margin-bottom: 12px; }
.thought .more-link-dark { align-self: flex-end; }
@media (max-width: 760px) {
  .thoughts { grid-template-columns: 1fr; }
  .thought:first-child { border-inline-end: 0; border-bottom: 1px solid #b9976a55; padding-bottom: 22px; margin-bottom: 22px; }
}

/* ---------- quotes ---------- */
.quotes { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(12px, 2.5vw, 28px); }
.quote-box { border: 1px solid #c8a24e55; background: #0000002a; padding: clamp(22px, 4vw, 38px) clamp(18px, 3vw, 34px); text-align: center; }
.q-orn {
  display: block; position: relative; height: 8px; margin-bottom: 16px;
  background: radial-gradient(circle, var(--gold) 0 3.5px, transparent 4px) center / 8px 8px no-repeat;
}
.q-orn::before, .q-orn::after { content: ""; position: absolute; top: 50%; width: 34px; height: 1px; background: #c8a24e88; }
.q-orn::before { right: calc(50% + 12px); }
.q-orn::after  { left: calc(50% + 12px); }
.quote-box p { font-size: 14px; line-height: 2.4; color: #efe6d2; margin-bottom: 10px; }
.q-by { display: block; font-style: normal; font-size: 12px; color: var(--gold-2); margin-bottom: 14px; }
@media (max-width: 760px) { .quotes { grid-template-columns: 1fr; } }

/* ---------- articles ---------- */
.articles { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(14px, 3vw, 32px); }
.art-card { display: flex; flex-direction: column; background: #faf6ec; border: 1px solid #e6dcc6; box-shadow: 0 6px 20px #3a2a1214; padding: 12px 12px 14px; }

  height: 120px; display: grid; align-content: end; justify-items: center; padding-bottom: 16px; gap: 2px;
}
.art-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.art-head h3 { font-size: 17px; font-weight: 600; line-height: 1.8; }
.art-card ul { padding: 8px 8px 6px; }
.art-card li { border-bottom: 1px solid #e6dcc6; }
.art-card li a { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 13px; color: #3d3226; }
.art-card li a::before { content: ""; width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); flex: none; }
.art-card li a:hover { color: var(--brown); }
.art-card .more-link-dark { align-self: flex-end; margin: 10px 8px 0; }
@media (max-width: 900px) { .articles { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .articles { grid-template-columns: 1fr; } }

/* ---------- events (تقریبات) ---------- */
.events { display: grid; grid-template-columns: 1fr 1.15fr; gap: clamp(20px, 4vw, 48px); }
.ev-head { border-bottom: 1px solid #c8a24e66; padding-bottom: 6px; margin-bottom: 14px; font-size: 14px; color: var(--gold-2); }
.video-main { aspect-ratio: 16 / 8.5; border-radius: 6px; }
.video-main .caption, .video-sm .caption {
  position: absolute; inset: auto 0 0 0; padding: 4px 12px; font-size: 12px; background: linear-gradient(transparent, #000a); color: #fff;
}
.play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);

}
.play svg { width: 18px; height: 18px; margin-left: 2px; }
.play.sm { width: 30px; height: 30px; }
.play.sm svg { width: 12px; height: 12px; }
.video-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.video-sm, .photo-card {
  background: var(--green-2); border: 1px solid #c8a24e44; border-radius: 6px; min-height: 96px; position: relative;
  display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--gold-2);
}
.photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.photo-card { min-height: clamp(110px, 14vw, 150px); align-content: center; justify-items: center; gap: 6px; }
.photo-card:hover { background: var(--green-3); border-color: var(--gold); }
.more-link { display: inline-block; margin-top: 14px; font-size: 13px; color: var(--gold-2); border-bottom: 1px solid var(--gold); }
@media (max-width: 860px) { .events { grid-template-columns: 1fr; } }

/* =========================================================

   ========================================================= */
::selection { background: #c8a24e55; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {

}

<section class="section dark year-sec"><span class="badge">خصوصی</span><div class="container year"><div class="year-num"><span>۲۰۱۰ء</span></div><div class="year-text"><h2>ایف حافظ سائیں محمد اقبال</h2><p>یہاں بینر کا مختصر تعارف درج ہوگا جو اس سال کی اہمیت اور واقعے کا خلاصہ بیان کرے۔ یہ متن نمونے کے طور پر رکھا گیا ہے۔</p><a class="btn-gold">مزید پڑھیں <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a></div></div></section>

<script>
const SRC = document.getElementById("src").textContent;
const stage = document.getElementById("stage");
const r = document.getElementById("r"), wl = document.getElementById("w");
const btns = [...document.querySelectorAll(".bar button")];

function frame(w, h, scale, label) {
  const col = document.createElement("div"); col.className = "col";
  const box = document.createElement("div"); box.className = "dev";
  box.style.width = w * scale + "px"; box.style.height = h * scale + "px";
  const f = document.createElement("iframe");
  f.style.width = w + "px"; f.style.height = h + "px";
  f.style.transform = "scale(" + scale + ")"; f.style.transformOrigin = "0 0";
  f.srcdoc = SRC; box.appendChild(f);
  if (label) { const s = document.createElement("span"); s.textContent = label; col.appendChild(s); }
  col.appendChild(box); return col;
}

function single(w) {
  stage.innerHTML = "";
  const availW = stage.clientWidth - 36, availH = stage.clientHeight - 36;
  const scale = Math.min(1, availW / w);
  const h = Math.floor(availH / scale);
  stage.appendChild(frame(w, h, scale));
  r.value = w; wl.textContent = w + "px";
}
function all() {
  stage.innerHTML = "";
  const ws = [1280, 768, 390], gap = 24;
  const availW = stage.clientWidth - 36 - gap * 2, availH = stage.clientHeight - 36 - 24;
  const scale = Math.min(1, availW / ws.reduce((a, b) => a + b, 0));
  const h = Math.floor(availH / scale);
  ws.forEach((w, i) => stage.appendChild(frame(w, h, scale, ["Desktop","Tablet","Mobile"][i] + " " + w)));
  wl.textContent = "3 views";
}
function set(v) {
  btns.forEach(b => b.classList.toggle("on", b.dataset.w === String(v)));
  v === "all" ? all() : single(+v);
}
btns.forEach(b => b.onclick = () => set(b.dataset.w));
r.oninput = () => { btns.forEach(b => b.classList.remove("on")); single(+r.value); };
addEventListener("resize", () => { const on = btns.find(b => b.classList.contains("on")); on ? set(on.dataset.w) : single(+r.value); });
set(1280);
</script></body></html>
